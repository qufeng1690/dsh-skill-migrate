name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 显式列出组合：ubuntu-latest 已经飘到 24.04/26.04，
        # 那些镜像上没有 Python 3.9 的 x64 构建，用 22.04 固定住。
        include:
          - os: ubuntu-22.04
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.9"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: 无 pyyaml（内置解析器路径）
        run: python tests/run_tests.py
      - name: 有 pyyaml（标准路径）
        run: |
          python -m pip install --quiet pyyaml
          python tests/run_tests.py
